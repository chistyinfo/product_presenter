<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Visualization - Fullscreen Mode</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* The host fills the viewport. js/pv_render.js letterboxes the stage
           (contain) inside it, so the background + product keep the exact
           proportions set in the editor. */
        #pv-stage-host {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }
        .controls.hidden { opacity: 0; pointer-events: none; }

        .control-button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        .control-button:hover { background-color: rgba(255, 255, 255, 0.2); }

        /* Product Info */
        .product-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .product-info.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .product-name { font-size: 1.5rem; font-weight: 600; margin-bottom: 5px; }
        .product-description { font-size: 0.9rem; opacity: 0.8; }

        /* Navigation arrows for switching products in the same room */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.45);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 54px;
            height: 54px;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }
        .nav-button:hover { background-color: rgba(0,0,0,0.75); }
        .nav-button.left { left: 18px; }
        .nav-button.right { right: 18px; }
        .nav-button.hidden { display: none; }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error Message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 420px;
            z-index: 101;
        }
        .error-message i { font-size: 3rem; color: #ff5252; margin-bottom: 15px; }
        .error-message h2 { margin-bottom: 10px; }
        .error-message p { margin-bottom: 20px; opacity: 0.8; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary { background-color: #4CAF50; color: white; }
        .btn-primary:hover { background-color: #45a049; }

        @media (max-width: 768px) {
            .controls { bottom: 10px; padding: 8px 15px; }
            .control-button { width: 35px; height: 35px; font-size: 1rem; }
            .product-info { top: 10px; left: 10px; padding: 10px; max-width: 250px; }
            .product-name { font-size: 1.2rem; }
            .product-description { font-size: 0.8rem; }
            .nav-button { width: 42px; height: 42px; }
        }

        .fullscreen-container:not(:hover) .auto-hide { opacity: 0; }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading product visualization...</p>
    </div>

    <!-- Error -->
    <div id="error-message" class="error-message" style="display: none;">
        <i class="fas fa-exclamation-triangle"></i>
        <h2>Error Loading Product</h2>
        <p>The requested product could not be loaded. Please try again later.</p>
        <button class="btn btn-primary" onclick="window.history.back()">Go Back</button>
    </div>

    <!-- The single shared stage, rendered by js/pv_render.js -->
    <div id="pv-stage-host" style="display: none;"></div>

    <!-- Product Info -->
    <div id="product-info" class="product-info">
        <div id="product-name" class="product-name">Product Name</div>
        <div id="product-description" class="product-description">Product description goes here.</div>
    </div>

    <!-- Product navigation (same room) -->
    <button id="prev-product-btn" class="nav-button left" title="Previous Product"><i class="fas fa-chevron-left"></i></button>
    <button id="next-product-btn" class="nav-button right" title="Next Product"><i class="fas fa-chevron-right"></i></button>

    <!-- Controls -->
    <div id="controls" class="controls">
        <button id="exit-button" class="control-button" title="Exit">
            <i class="fas fa-times"></i>
        </button>
        <button id="info-toggle" class="control-button" title="Toggle Product Info">
            <i class="fas fa-info-circle"></i>
        </button>
        <button id="fullscreen-toggle" class="control-button" title="Toggle Fullscreen">
            <i class="fas fa-expand"></i>
        </button>
    </div>

    <!-- Shared renderer first, then the viewer logic.

         The ?v=3 tag is load-bearing: without it the browser keeps the PREVIOUS
         product_viz.js (the pre-renderScene version, which ran
         document.getElementById("viz-marking-area").style... on markup that no
         longer has that id) and every product fails with
         "Cannot read properties of null (reading 'style')".
         Bump this number whenever either of these two files changes. -->
    <script src="js/pv_render.js?v=3"></script>
    <script src="js/product_viz.js?v=3"></script>
    <script src="js/pc_remote_nav.js?v=2"></script>
</body>
</html>
